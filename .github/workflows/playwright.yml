name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, authenticated, api]
    env:
      TEST_ENV: staging
      # All values come from GitHub repository secrets — never hard-coded here.
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      API_URL: ${{ secrets.STAGING_API_URL }}
      TEST_USERNAME: ${{ secrets.STAGING_TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      TEST_INVALID_USERNAME: ${{ secrets.STAGING_TEST_INVALID_USERNAME }}
      TEST_INVALID_PASSWORD: ${{ secrets.STAGING_TEST_INVALID_PASSWORD }}
      API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: |
          npm run lint
          npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: reports/html/
          retention-days: 14

      - name: Upload traces, videos and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7
